[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_tool"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["D"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
ignore_missing_imports = true
disable_error_code = ["type-arg", "no-untyped-def"]